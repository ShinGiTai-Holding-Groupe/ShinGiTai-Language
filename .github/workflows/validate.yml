name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate architecture
        run: npm run validate:architecture

      - name: Typecheck
        run: npm run typecheck

      - name: Lint atoms 16-22 foundation
        run: npm run lint:foundation

      - name: Test foundation contracts
        run: npm run test:foundation

      - name: Build
        run: npm run build
